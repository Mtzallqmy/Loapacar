name: Android preview
on:
  push:
    paths: ["app/**", "gradle/**", "*.kts", "gradle.properties", ".github/workflows/android-preview.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Prepare ephemeral CI signer
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/mycar-ci.p12" -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 7 -dname "CN=Ephemeral CI Preview"
          echo "MASALIK_KEYSTORE=$RUNNER_TEMP/mycar-ci.p12" >> "$GITHUB_ENV"
      - name: Exercise physics, verify Android assets and assemble
        run: ./gradlew :app:testDebugUnitTest :app:assemblePreview :app:lintPreview
      - name: Verify packaged native code and certificate
        run: |
          apk=app/build/outputs/apk/preview/app-preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          unzip -t "$apk" lib/arm64-v8a/libmycar_contacts.so
          sha256sum "$apk" > app/build/outputs/apk/preview/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: MyCar-CI-Preview
          path: |
            app/build/outputs/apk/preview/*.apk
            app/build/outputs/apk/preview/SHA256SUMS
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-preview.html
