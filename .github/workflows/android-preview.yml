name: Android preview
on:
  push:
    paths: ["app/**", "gradle/**", "*.kts", "gradle.properties", ".github/workflows/android-preview.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Prepare ephemeral CI signer
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/mycar-ci.p12" -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 7 -dname "CN=Ephemeral CI Preview"
          echo "MASALIK_KEYSTORE=$RUNNER_TEMP/mycar-ci.p12" >> "$GITHUB_ENV"
      - name: Exercise physics, verify Android assets and assemble
        run: ./gradlew :app:testDebugUnitTest :app:assembleJourneys :app:lintJourneys
      - name: Verify packaged native code and certificate
        run: |
          apk=app/build/outputs/apk/journeys/app-journeys.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          unzip -t "$apk" lib/arm64-v8a/libmycar_contacts.so
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > app/build/outputs/apk/journeys/signing.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > app/build/outputs/apk/journeys/package.txt
          sha256sum "$apk" > app/build/outputs/apk/journeys/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: MyCar-4.0-Cities-Android8Plus-ARM64
          path: |
            app/build/outputs/apk/journeys/*.apk
            app/build/outputs/apk/journeys/SHA256SUMS
            app/build/outputs/apk/journeys/*.txt
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-journeys.html
      - name: Build emulator companion
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
          git worktree add --detach "$RUNNER_TEMP/cockpit34" de609f57b350d4dc46f2b7e35e388175a9a6a120
          sed -i 's/applicationIdSuffix = ".preview"/applicationIdSuffix = ".legacy34"/g' "$RUNNER_TEMP/cockpit34/app/build.gradle.kts"
          (cd "$RUNNER_TEMP/cockpit34" && ./gradlew :app:assembleDebug)
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch cockpit, autopilot and journeys on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install "$RUNNER_TEMP/cockpit34/app/build/outputs/apk/debug/app-debug.apk"
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            mkdir -p journey-captures
            adb shell am instrument -w com.masalik.yemen.preview.test/com.masalik.yemen.TouchDriveProbe > journey-captures/touch.txt
            grep -q 'PASS two pointers' journey-captures/touch.txt
            python3 scripts/backup-handoff.py
            python3 scripts/drive-benchmark.py
            python3 scripts/smoke-journeys.py
            if [ "${{ contains(github.event.head_commit.message, '[cities-preview]') }}" = "true" ]; then bash scripts/soak-package.sh; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-journey-captures
          path: journey-captures/
          if-no-files-found: ignore

  publish-cities-preview:
    needs: test-and-build
    if: github.ref == 'refs/heads/feat/sayyarati-4-cities' && contains(github.event.head_commit.message, '[cities-preview]')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MyCar-4.0-Cities-Android8Plus-ARM64
          path: verified
      - uses: actions/download-artifact@v4
        with:
          name: Android-journey-captures
          path: captures
      - name: Publish verified preview and evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          apk=MyCar-4.0.0-Cities-Preview-Android8Plus-ARM64.apk
          cp verified/outputs/apk/journeys/app-journeys.apk "$apk"
          sha256sum "$apk" > SHA256SUMS
          zip -rq MyCar-4.0-Testing.zip captures verified/test-results verified/outputs/apk/journeys/package.txt verified/outputs/apk/journeys/signing.txt
          gh release create v4.0.0-cities-preview.1 "$apk" SHA256SUMS MyCar-4.0-Testing.zip --target "$GITHUB_SHA" --prerelease --title 'سيارتي 4.0 — مدن اليمن (معاينة أندرويد)' --notes-file docs/cities-release-ar.md
